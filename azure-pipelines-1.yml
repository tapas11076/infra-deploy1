# Starter pipeline
# Use a variable group (or pipeline variables) to provide sensitive or environment-specific values.
trigger:
- main

pool:
  vmImage: ubuntu-latest

# Recommended: create an Azure DevOps variable group (e.g. infra-params) and link it to this pipeline.
# Put sourceSSHAddress in the variable group and mark it as secret, or supply at queue-time.
steps:
- task: AzureResourceManagerTemplateDeployment@3
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: 'ADO-Linked-Subscription(1)(3c4a1810-ddb7-481a-9558-461ac6289480)'
    subscriptionId: '3c4a1810-ddb7-481a-9558-461ac6289480'
    action: 'Create Or Update Resource Group'
    resourceGroupName: 'project-try-5'
    location: 'West Central US'
    templateLocation: 'Linked artifact'
    csmFile: './infra-deploy1.bicep'
    # Pass the vnet name and the SSH CIDR as pipeline variables rather than hardcoding IPs in YAML.
    overrideParameters:
      -vnetName "$(vnetName)"
      -sourceSSHAddress "$(sourceSSHAddress)"
    deploymentMode: 'Incremental'
    deploymentName: 'project-try-5-devops-deployment'